<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lupa Password — Hijabii by Intan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Jost:wght@400;500&display=swap">
<link rel="stylesheet" href="../assets/css/tokens.css">
<link rel="stylesheet" href="../assets/css/components.css">
<style>
  body{min-height:100svh;display:grid;place-items:center;background:var(--cream);padding:1rem}
  .card{width:min(100%,400px);background:var(--paper);border:1px solid var(--sand);border-radius:24px;
    padding:2rem 1.75rem;box-shadow:var(--shadow-md)}
  .brand{text-align:center;margin-bottom:2rem}
  .brand h1{font-family:var(--font-serif);font-size:28px;color:var(--ink)}
  .brand p{color:var(--mocha);font-size:13px;margin-top:4px}
  .form-stack{display:grid;gap:1rem}
  .back{text-align:center;margin-top:1rem;font-size:13px}
  .back a{color:var(--marsala);text-decoration:none}
  .back a:hover{text-decoration:underline}
  .success-state{display:none;text-align:center;padding:1rem 0}
  .success-state.show{display:block}
  .success-icon{font-size:48px;margin-bottom:1rem}
</style>
</head>
<body>
<div class="card">
  <div class="brand">
    <h1>Hijabii by Intan</h1>
    <p>Atur Ulang Password</p>
  </div>

  <div id="formState">
    <p style="font-size:13px;color:var(--mocha);margin-bottom:1.25rem;text-align:center">
      Masukkan email akun Anda. Kami akan mengirim link untuk mengatur ulang password.
    </p>
    <form class="form-stack" id="resetForm" novalidate>
      <div class="field">
        <label class="label" for="email">Email <span class="req">*</span></label>
        <input class="input" type="email" id="email" name="email" autocomplete="email" required
          placeholder="nama@email.com">
        <span class="field-error" id="emailErr"></span>
      </div>
      <button class="btn btn-primary" type="submit" id="submitBtn" style="width:100%">
        Kirim Link Reset
      </button>
    </form>
    <div class="back"><a href="login.html">← Kembali ke halaman masuk</a></div>
  </div>

  <div class="success-state" id="successState">
    <div class="success-icon">📬</div>
    <h2 style="font-family:var(--font-serif);font-size:22px;margin-bottom:.5rem">Link Terkirim</h2>
    <p style="font-size:13px;color:var(--mocha);margin-bottom:1.5rem">
      Cek email Anda dan klik link di dalamnya untuk mengatur ulang password.
      Link berlaku selama 1 jam.
    </p>
    <a href="login.html" class="btn btn-secondary" style="width:100%">Kembali ke Masuk</a>
  </div>
</div>

<script type="module">
import { supabase } from '../assets/js/supabase.js';
import { withLoading } from '../assets/js/ui.js';

document.getElementById('resetForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = document.getElementById('email').value.trim();
  document.getElementById('emailErr').textContent = '';
  if (!email) { document.getElementById('emailErr').textContent = 'Email wajib diisi.'; return; }

  const btn = document.getElementById('submitBtn');
  await withLoading(btn, async () => {
    await supabase.auth.resetPasswordForEmail(email, {
      redirectTo: new URL('ganti-password.html', location.href).href
    });
    // Selalu tampilkan sukses (jangan bocorkan apakah email terdaftar)
    document.getElementById('formState').style.display = 'none';
    document.getElementById('successState').classList.add('show');
  }, 'Mengirim…');
});
</script>
</body>
</html>
