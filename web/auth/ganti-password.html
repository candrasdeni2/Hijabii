<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ganti Password — Hijabii by Intan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Jost:wght@400;500&display=swap">
<link rel="stylesheet" href="../assets/css/tokens.css">
<link rel="stylesheet" href="../assets/css/components.css">
<style>
  body{min-height:100svh;display:grid;place-items:center;background:var(--cream);padding:1rem}
  .card{width:min(100%,400px);background:var(--paper);border:1px solid var(--sand);border-radius:24px;
    padding:2rem 1.75rem;box-shadow:var(--shadow-md)}
  .brand{text-align:center;margin-bottom:2rem}
  .brand h1{font-family:var(--font-serif);font-size:28px;color:var(--ink)}
  .brand p{color:var(--mocha);font-size:13px;margin-top:4px}
  .notice{background:#FEF9EC;border:1px solid #F0D98A;border-radius:12px;padding:.875rem 1rem;
    font-size:13px;color:#7A5C00;margin-bottom:1.25rem;display:none}
  .notice.show{display:block}
  .form-stack{display:grid;gap:1rem}
  .strength{height:4px;border-radius:4px;background:var(--sand);margin-top:4px;overflow:hidden}
  .strength-bar{height:100%;width:0;border-radius:4px;transition:width .3s,background .3s}
</style>
</head>
<body>
<div class="card">
  <div class="brand">
    <h1>Hijabii by Intan</h1>
    <p id="subtitle">Ganti Password</p>
  </div>

  <div class="notice show" id="notice" role="status">
    Demi keamanan, Anda wajib mengganti password sebelum melanjutkan.
  </div>

  <form class="form-stack" id="changeForm" novalidate>
    <div class="field">
      <label class="label" for="newPass">Password Baru <span class="req">*</span></label>
      <input class="input" type="password" id="newPass" name="newPass" autocomplete="new-password" required
        placeholder="Minimal 8 karakter">
      <div class="strength"><div class="strength-bar" id="strengthBar"></div></div>
      <span class="field-error" id="newPassErr"></span>
    </div>
    <div class="field">
      <label class="label" for="confirmPass">Konfirmasi Password <span class="req">*</span></label>
      <input class="input" type="password" id="confirmPass" name="confirmPass" autocomplete="new-password" required
        placeholder="Ulangi password baru">
      <span class="field-error" id="confirmErr"></span>
    </div>
    <button class="btn btn-primary" type="submit" id="submitBtn" style="width:100%;margin-top:.5rem">
      Simpan Password
    </button>
  </form>
</div>

<script type="module">
import { supabase } from '../assets/js/supabase.js';
import { getProfile, signOut } from '../assets/js/auth.js';
import { ROUTES, roleHome } from '../assets/js/routes.js';
import { withLoading, toast } from '../assets/js/ui.js';

// Cek login
(async () => {
  const p = await getProfile();
  if (!p) location.replace(ROUTES.login);
})();

// Indikator kekuatan password
document.getElementById('newPass').addEventListener('input', (e) => {
  const v = e.target.value;
  const bar = document.getElementById('strengthBar');
  let score = 0;
  if (v.length >= 8) score++;
  if (/[A-Z]/.test(v)) score++;
  if (/[0-9]/.test(v)) score++;
  if (/[^A-Za-z0-9]/.test(v)) score++;
  const colors = ['#E57373','#FFB74D','#81C784','#4E6E58'];
  const widths = ['25%','50%','75%','100%'];
  bar.style.width = score ? widths[score-1] : '0';
  bar.style.background = score ? colors[score-1] : '';
});

// Form submit
document.getElementById('changeForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const newPass = document.getElementById('newPass').value;
  const confirmPass = document.getElementById('confirmPass').value;
  document.getElementById('newPassErr').textContent = '';
  document.getElementById('confirmErr').textContent = '';

  if (newPass.length < 8) { document.getElementById('newPassErr').textContent = 'Minimal 8 karakter.'; return; }
  if (newPass !== confirmPass) { document.getElementById('confirmErr').textContent = 'Password tidak sama.'; return; }

  const btn = document.getElementById('submitBtn');
  await withLoading(btn, async () => {
    const { error } = await supabase.auth.updateUser({ password: newPass });
    if (error) { toast('Gagal menyimpan password. Coba lagi.', 'error'); return; }

    // Hapus kewajiban ganti password + banner. Harus lewat RPC: update langsung ditolak trigger profiles_protect.
    const { error: flagErr } = await supabase.rpc('clear_password_flags');
    if (flagErr) { toast('Password tersimpan, tetapi status akun gagal diperbarui. Hubungi admin.', 'error'); return; }
    await supabase.rpc('dismiss_password_notice');

    toast('Password berhasil diubah.', 'success');
    setTimeout(async () => {
      const p = await getProfile();
      location.replace(roleHome(p?.role ?? 'customer'));
    }, 1200);
  }, 'Menyimpan…');
});
</script>
</body>
</html>
