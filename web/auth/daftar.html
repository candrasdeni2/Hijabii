<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daftar — Hijabii by Intan</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Jost:wght@400;500&display=swap">
<link rel="stylesheet" href="../assets/css/tokens.css">
<link rel="stylesheet" href="../assets/css/components.css">
<style>
  :root{--login-brown:#4A3A2E}

  body{min-height:100svh;display:grid;place-items:center;background:var(--cream);padding:1.5rem}

  .login-shell{
    width:min(100%,1040px);min-height:620px;
    display:grid;grid-template-columns:1fr 1fr;
    background:var(--paper);border:1px solid var(--sand);border-radius:24px;
    overflow:hidden;box-shadow:var(--shadow-md)
  }

  .hero{
    position:relative;min-height:100%;
    background:url('../assets/img/hero-02.png') 68% center/cover no-repeat;
  }
  .hero::after{
    content:"";position:absolute;inset:0;
    background:linear-gradient(to top,rgba(60,44,34,.55) 0%,rgba(60,44,34,0) 45%);
  }
  .hero-logo,.hero-copy{position:absolute;left:2rem;z-index:1}
  .hero-logo{
    top:2rem;font-family:var(--font-serif);font-size:26px;letter-spacing:.14em;
    color:var(--ink);text-transform:uppercase
  }
  .hero-copy{bottom:2rem;right:2rem;color:#fff}
  .hero-copy h2{font-family:var(--font-serif);font-weight:400;font-size:30px;line-height:1.2}
  .hero-copy p{font-size:13px;margin-top:.5rem;opacity:.92}

  .login-card{display:flex;flex-direction:column;justify-content:center;padding:3rem 3.5rem}
  .brand{margin-bottom:2rem}
  .brand .wordmark{
    font-family:var(--font-serif);font-weight:400;font-size:34px;letter-spacing:.14em;
    color:var(--ink);text-transform:uppercase;margin-bottom:1.5rem
  }
  .brand h1{font-family:var(--font-serif);font-weight:600;font-size:26px;color:var(--ink)}
  .brand p{color:var(--mocha);font-size:14px;margin-top:6px}

  .form-stack{display:grid;gap:1rem}

  .input-wrap{position:relative}
  .input-wrap svg{
    position:absolute;left:14px;top:50%;transform:translateY(-50%);
    width:18px;height:18px;stroke:var(--mocha);fill:none;stroke-width:1.5;
    stroke-linecap:round;stroke-linejoin:round;pointer-events:none
  }
  .input-wrap .input{padding-left:44px;width:100%}

  /* tombol tampilkan/sembunyikan password */
  .input-wrap .input.has-toggle{padding-right:48px}
  .pw-toggle{
    position:absolute;right:4px;top:50%;transform:translateY(-50%);
    width:44px;height:44px;display:grid;place-items:center;
    border:0;border-radius:999px;background:none;color:var(--mocha);cursor:pointer
  }
  .pw-toggle:hover{color:var(--ink)}
  .pw-toggle:focus-visible{outline:2px solid var(--marsala);outline-offset:-2px}
  .pw-toggle:disabled{opacity:.5;cursor:not-allowed}
  .input-wrap .pw-toggle svg{position:static;transform:none;width:20px;height:20px;stroke:currentColor}
  .pw-toggle[aria-pressed="true"] .eye,
  .pw-toggle:not([aria-pressed="true"]) .eye-off{display:none}

  #submitBtn{
    width:100%;margin-top:.5rem;background:var(--login-brown);border-color:var(--login-brown);color:#fff
  }
  #submitBtn:hover{filter:brightness(1.12)}

  .to-login{text-align:center;margin-top:1.25rem;font-size:13px;color:var(--mocha)}
  .to-login a{color:var(--marsala);text-decoration:none;font-weight:500}
  .to-login a:hover{text-decoration:underline}

  .reason-banner{border-radius:12px;padding:.75rem 1rem;font-size:13px;margin-bottom:1rem;display:none}
  .reason-banner.show{display:block}
  .reason-banner[data-kind="error"]{background:#FDF0F0;color:var(--error);border:1px solid #F5C6C6}
  .reason-banner[data-kind="success"]{background:#EFF6F1;color:var(--success);border:1px solid #B8D9C2}

  @media (max-width:768px){
    body{padding:0;display:block;background:transparent}
    .login-shell{
      position:relative;width:100%;min-height:100svh;
      display:flex;flex-direction:column;justify-content:center;
      background:transparent;border:0;border-radius:0;box-shadow:none;overflow:visible
    }
    .hero{
      position:fixed;inset:0;z-index:0;min-height:0;height:auto;
      background-position:62% top
    }
    .hero::after{background:linear-gradient(to top,rgba(60,44,34,.25) 0%,rgba(60,44,34,0) 55%)}
    .hero-logo,.hero-copy{display:none}

    .login-card{
      position:relative;z-index:1;justify-content:flex-start;
      margin:1rem;
      padding:1.75rem 1.5rem;border-radius:24px;
      background:color-mix(in srgb,var(--paper) 88%,transparent);
      -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
      border:1px solid rgba(255,255,255,.55);box-shadow:var(--shadow-md)
    }
    .brand{margin-bottom:1.25rem}
    .brand .wordmark{text-align:center;font-size:26px;margin-bottom:1.25rem}
    .brand h1{font-size:22px}
  }
</style>
</head>
<body>
<div class="login-shell">

  <!-- Panel gambar -->
  <aside class="hero" aria-hidden="true">
    <div class="hero-logo">Hijabii</div>
    <div class="hero-copy">
      <h2>Pretty with hijab,<br>pretty with Hijabii.</h2>
      <p>Hijab nyaman, berkualitas, dan terjangkau untuk setiap langkahmu.</p>
    </div>
  </aside>

  <!-- Panel form -->
  <div class="login-card">
    <div class="brand">
      <div class="wordmark">Hijabii</div>
      <h1>Buat Akun</h1>
      <p>Daftar untuk mulai berbelanja</p>
    </div>

    <div class="reason-banner" id="banner" role="alert"></div>

    <form class="form-stack" id="regForm" novalidate>
      <div class="field">
        <label class="label" for="name">Nama lengkap <span class="req">*</span></label>
        <div class="input-wrap">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="7" r="4"/><path d="M5.5 21a8.5 8.5 0 0 1 13 0"/></svg>
          <input class="input" type="text" id="name" name="name" autocomplete="name" required
            placeholder="Nama Anda">
        </div>
        <span class="field-error" id="nameErr"></span>
      </div>
      <div class="field">
        <label class="label" for="email">Email <span class="req">*</span></label>
        <div class="input-wrap">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
          <input class="input" type="email" id="email" name="email" autocomplete="email" required
            placeholder="nama@email.com">
        </div>
        <span class="field-error" id="emailErr"></span>
      </div>
      <div class="field">
        <label class="label" for="password">Password <span class="req">*</span></label>
        <div class="input-wrap">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
          <input class="input has-toggle" type="password" id="password" name="password" autocomplete="new-password" required
            placeholder="Minimal 8 karakter">
          <button type="button" class="pw-toggle" id="pwToggle" aria-label="Tampilkan password" aria-pressed="false">
            <svg class="eye" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="eye-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3l18 18"/><path d="M10.6 5.1A10.9 10.9 0 0 1 12 5c6.5 0 10 7 10 7a17.6 17.6 0 0 1-3.2 4.1"/><path d="M6.6 6.6A17.4 17.4 0 0 0 2 12s3.5 7 10 7a10.6 10.6 0 0 0 4.4-1"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
          </button>
        </div>
        <span class="field-error" id="passErr"></span>
      </div>
      <button class="btn btn-primary" type="submit" id="submitBtn">
        Buat Akun
      </button>
    </form>

    <p class="to-login">Sudah punya akun? <a href="login.html">Masuk</a></p>
  </div>

</div>

<script type="module">
import { supabase } from '../assets/js/supabase.js';
import { requireAuth } from '../assets/js/auth.js';
import { roleHome } from '../assets/js/routes.js';
import { withLoading } from '../assets/js/ui.js';

const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;

// Sudah login → langsung ke beranda peran
(async () => {
  const p = await requireAuth({ redirect: false });
  if (p) location.replace(roleHome(p.role));
})();

const banner = document.getElementById('banner');
const showBanner = (msg, kind = 'error') => {
  banner.textContent = msg;
  banner.dataset.kind = kind;
  banner.classList.add('show');
};
const setErr = (id, t) => { document.getElementById(id).textContent = t; };

// Tampilkan / sembunyikan password
const pw = document.getElementById('password');
const pwBtn = document.getElementById('pwToggle');
pwBtn.addEventListener('click', () => {
  const show = pw.type === 'password';
  pw.type = show ? 'text' : 'password';
  pwBtn.setAttribute('aria-pressed', String(show));
  pwBtn.setAttribute('aria-label', show ? 'Sembunyikan password' : 'Tampilkan password');
  pw.focus();
});

document.getElementById('regForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  ['nameErr','emailErr','passErr'].forEach((id) => setErr(id, ''));
  banner.classList.remove('show');

  const name  = document.getElementById('name').value.trim();
  const email = document.getElementById('email').value.trim().toLowerCase();
  const pass  = document.getElementById('password').value;

  let bad = false;
  if (!name)                 { setErr('nameErr',  'Nama wajib diisi.'); bad = true; }
  if (!EMAIL_RE.test(email)) { setErr('emailErr', 'Email tidak valid.'); bad = true; }
  if (pass.length < 8)       { setErr('passErr',  'Password minimal 8 karakter.'); bad = true; }
  if (bad) return;

  const btn = document.getElementById('submitBtn');
  await withLoading(btn, async () => {
    const { error } = await supabase.auth.signUp({
      email,
      password: pass,
      options: { data: { full_name: name } },
    });

    if (error) {
      const msg = /already registered/i.test(error.message)
        ? 'Email sudah terdaftar. Silakan masuk.'
        : error.message || 'Pendaftaran gagal. Coba lagi.';
      showBanner(msg, 'error');
      return;
    }

    showBanner('Akun berhasil dibuat! Cek email Anda untuk verifikasi, lalu masuk.', 'success');
    // Nonaktifkan form setelah berhasil
    document.getElementById('regForm').querySelectorAll('input,button').forEach((el) => { el.disabled = true; });
    setTimeout(() => { location.replace('login.html'); }, 3000);
  }, 'Memproses…');
});
</script>
</body>
</html>
